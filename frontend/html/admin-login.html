<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2196F3">
    <title>Admin Login - KRUSHI MITHRA</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-login.css">
    <script src="../js/config.js"></script>
    <script src="../js/language-manager.js"></script>
</head>
<body class="admin-body">
    <!-- Floating decorative elements -->
    <div style="position: fixed; top: 8%; right: 8%; font-size: 3rem; opacity: 0.15; animation: floatSlow 9s ease-in-out infinite;">👨‍💼</div>
    <div style="position: fixed; bottom: 12%; left: 8%; font-size: 3rem; opacity: 0.15; animation: floatSlow 11s ease-in-out infinite; animation-delay: 1s;">📈</div>
    <div style="position: fixed; top: 45%; right: 5%; font-size: 2.5rem; opacity: 0.12; animation: floatSlow 10s ease-in-out infinite; animation-delay: 2s;">🔧</div>

    <div class="login-wrapper">
        <div class="login-container">
            <!-- Left Side - Branding -->
            <div class="login-left">
                <div class="branding">
                    <div class="logo-circle">
                        <span class="logo-icon">🌾</span>
                    </div>
                    <h1>🚜 KRUSHI MITHRA</h1>
                    <p class="tagline">👨‍💼 Admin Dashboard</p>
                    <div class="features-list">
                        <div class="feature-item">
                            <span class="check-icon">✓</span>
                            <span>👥 Manage Farmers</span>
                        </div>
                        <div class="feature-item">
                            <span class="check-icon">✓</span>
                            <span>✅ Approve Registrations</span>
                        </div>
                        <div class="feature-item">
                            <span class="check-icon">✓</span>
                            <span>📊 Monitor Activities</span>
                        </div>
                        <div class="feature-item">
                            <span class="check-icon">✓</span>
                            <span>📈 Analytics & Reports</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="login-right">
                <div class="login-form-wrapper">
                    <div class="login-header">
                        <h2>🔐 Admin Login</h2>
                        <p>Enter your credentials to access the dashboard</p>
                    </div>

                    <form id="adminLoginForm" class="login-form" novalidate>
                        <!-- Username Field -->
                        <div class="form-group">
                            <label for="username">
                                <span class="icon">👤</span>
                                <span class="label-text">Username</span>
                            </label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >
                            <span class="error-message" id="usernameError"></span>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group">
                            <label for="password">
                                <span class="icon">🔒</span>
                                <span class="label-text">Password</span>
                            </label>
                            <div class="password-wrapper">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                    <span class="eye-icon">👁️</span>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                        </div>

                        <!-- Remember Me -->
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="rememberMe" name="rememberMe">
                                <span>Remember me</span>
                            </label>
                            <a href="#forgot-password" class="forgot-password">Forgot Password?</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-login" id="loginBtn">
                            <span class="btn-text">🚀 Sign In</span>
                            <span class="btn-loader"></span>
                        </button>

                        <!-- Message Area -->
                        <div id="loginMessage" class="login-message"></div>
                    </form>

                    <!-- Back to Home -->
                    <div class="form-footer">
                        <p>
                            <a href="index.html" class="back-link">
                                🏠 ← Back to Homepage
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Authenticating...</p>
    </div>

    <script src="../js/admin-login.js"></script>
</body>
</html>
