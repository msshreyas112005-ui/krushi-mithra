# Netlify configuration for KRUSHI MITHRA Frontend

[build]
  # Directory where the build artifacts are located
  publish = "frontend"
  
  # No build command needed for static frontend
  command = "echo 'Static site - no build needed'"

# Redirect all API calls to the backend
[[redirects]]
  from = "/api/*"
  to = "https://krushi-mithra-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Redirect root to frontend index
[[redirects]]
  from = "/"
  to = "/html/index.html"
  status = 200

# SPA fallback (for any other routes)
[[redirects]]
  from = "/*"
  to = "/html/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
